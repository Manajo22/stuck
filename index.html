<title>stuck</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Instrument+Serif:ital@0;1&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: the TV fills the window; controls live in a white-on-black drawer on the right */
:root {
  --room: #15110e;
  --panel: #231b16;
  --panel-edge: #3a2d24;
  --ink: #f1e8da;
  --muted: #a7968a;
  --amber: #e9b04c;
  --live: #ff4d3d;
  --font-serif: "Instrument Serif", "Iowan Old Style", Georgia, "Times New Roman", serif;
  --font-osd: "DotGothic16", "IBM Plex Mono", ui-monospace, monospace;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-data: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; background: var(--room); color: var(--ink); }
body {
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.5;
  padding-inline: 16px;
  padding-block: 16px;
  box-sizing: border-box;
  overflow: hidden;
  transition: padding-right 240ms ease;
  background:
    radial-gradient(ellipse 70% 55% at 50% 45%, rgba(233,176,76,0.08), transparent 70%),
    var(--room);
}
/* the TV column fills as much of the window as a 4:3 set can */
.tvcol {
  --tvw: min(100%, calc((100dvh - 32px - 52px) * 4 / 3));
  width: var(--tvw); max-width: 100%;
  height: 100%;
  margin: 0 auto;
  display: flex; flex-direction: column; justify-content: center; gap: 10px;
}
h1 { font-family: var(--font-serif); font-weight: 400; font-style: italic; font-size: clamp(26px, 4vw, 34px); letter-spacing: -0.01em; margin: 0; line-height: 1; color: var(--ink); }

.stage { position: relative; width: 100%; max-width: 100%; aspect-ratio: 640 / 480; }
.stage canvas {
  position: absolute;
  left: 4.6%; top: 9.4%; width: 70.6%; height: 70.4%;
  border-radius: 6% / 8%;
  background: #000;
  cursor: crosshair;
  touch-action: none;
}
.stage img.tv { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; user-select: none; filter: drop-shadow(0 24px 40px rgba(0,0,0,0.55)); }
.osd {
  position: absolute; left: 9%; top: 14%;
  font-family: var(--font-osd); font-size: clamp(11px, 2vw, 22px);
  color: #fff; text-shadow: 0 0 6px rgba(0,0,0,0.9), 2px 2px 0 rgba(0,0,0,0.6);
  letter-spacing: 0.06em; pointer-events: none;
}
button.osd { background: none; border: 0; padding: 0; border-radius: 0; pointer-events: none; display: block; line-height: 1.2; color: #fff; }
button.osd:hover { background: none; color: #fff; }
button.osd[data-state="tune"] {
  pointer-events: auto; cursor: pointer;
  background: #000; color: #fff;
  border: 2px solid #fff; border-radius: 0;
  padding: 0.45em 0.9em 0.4em;
  text-shadow: none;
  box-shadow: 4px 4px 0 rgba(0,0,0,0.6);
}
button.osd[data-state="tune"]:hover { background: #fff; color: #000; }
button.osd[data-state="tune"] .dot { background: var(--live); animation: blink 0.9s steps(2) infinite; }
.osd .dot { display: inline-block; width: 0.6em; height: 0.6em; border-radius: 50%; background: var(--live); margin-right: 0.4em; vertical-align: 0.05em; animation: blink 1.2s steps(2) infinite; }
.osd[data-state="idle"] .dot { background: var(--muted); animation: none; }
@keyframes blink { 50% { opacity: 0.2; } }

.status { font-family: var(--font-data); font-size: 12.5px; color: #fff; margin: 0; }
.status:empty { display: none; }

/* controls: hidden drawer on the right, white on black */
.toggle {
  position: fixed; z-index: 3;
  top: calc(16px + env(safe-area-inset-top, 0px)); right: 16px;
}
.drawer {
  position: fixed; z-index: 2; top: 0; right: 0; bottom: 0;
  width: min(320px, calc(100vw - 48px));
  background: #000; color: #fff;
  border-left: 1px solid #fff;
  padding: calc(72px + env(safe-area-inset-top, 0px)) 22px calc(24px + env(safe-area-inset-bottom, 0px));
  box-sizing: border-box;
  display: flex; flex-direction: column; gap: 22px;
  overflow-y: auto;
  transform: translateX(100%);
  transition: transform 220ms ease;
  visibility: hidden;
}
.drawer.open { transform: none; visibility: visible; }
.group { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.row { display: flex; flex-wrap: wrap; gap: 8px; }

button, .file {
  font: 500 14px/1 var(--font-body);
  color: #fff;
  background: #000;
  border: 1px solid #fff;
  border-radius: 999px;
  padding: 10px 16px;
  cursor: pointer;
  display: inline-flex; align-items: center; gap: 8px;
}
button:hover, .file:hover { background: #fff; color: #000; }
button:focus-visible, .file:focus-within, input:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
.file input { position: absolute; width: 1px; height: 1px; opacity: 0; }
.file { position: relative; }
.track { font-family: var(--font-data); font-size: 12px; color: #fff; margin: 0; overflow-wrap: anywhere; }

label.slider { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; font-size: 13px; color: #fff; }
label.slider output { font-family: var(--font-data); font-size: 12px; color: #fff; font-variant-numeric: tabular-nums; }
label.slider input { grid-column: 1 / -1; width: 100%; accent-color: #fff; }

.meter { height: 6px; border-radius: 3px; background: #222; overflow: hidden; }
.meter i { display: block; height: 100%; width: 0%; background: linear-gradient(90deg, #00e5ff, #f0ff00, #ff2bd6); transition: width 80ms linear; }

body.ctl-open { padding-right: calc(min(320px, 100vw - 48px) + 24px); }
@media (prefers-reduced-motion: reduce) { body { transition: none; } .osd .dot { animation: none; } .drawer { transition: none; } }
</style>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const canvas = $('screen');
  const statusEl = $('status');
  const osd = $('osd'), osdText = $('osdText');
  const gl = canvas.getContext('webgl', { premultipliedAlpha: false, antialias: false });
  if (!gl) { statusEl.textContent = 'This browser has WebGL turned off, so the screen cannot render.'; return; }

  // ---------- settings ----------
  const S = { speed: 1, sens: 1, trail: 0.92, zoom: 1, mirror: true, cutout: true, crt: true };
  const bindRange = (id, key, fmt) => {
    const el = $(id), out = $(id + 'Out');
    const upd = () => { S[key] = parseFloat(el.value); out.textContent = fmt(S[key]); };
    el.addEventListener('input', upd); upd();
  };
  bindRange('speed', 'speed', v => v.toFixed(1) + '×');
  bindRange('sens', 'sens', v => v.toFixed(1) + '×');
  bindRange('trail', 'trail', v => v.toFixed(2));
  

  // ---------- shaders ----------
  const vs = `attribute vec2 p; varying vec2 uv; void main(){ uv = p*0.5+0.5; gl_Position = vec4(p,0.,1.); }`;
  const fs = `
  precision mediump float;
  varying vec2 uv;
  uniform float uTime, uScroll, uHue, uPulse, uHasVid, uMaskMode, uMirror, uCrt, uZoom, uScreenA, uVidA;
  uniform vec2 uRes;
  uniform sampler2D uVid, uMask, uMotion;

  vec3 hsv2rgb(vec3 c){ vec3 p = abs(fract(c.xxx + vec3(0.,2./3.,1./3.))*6.-3.); return c.z*mix(vec3(1.), clamp(p-1.,0.,1.), c.y); }
  vec3 hueRot(vec3 c, float a){
    const vec3 k = vec3(0.57735);
    float ca = cos(a);
    return c*ca + cross(k,c)*sin(a) + k*dot(k,c)*(1.-ca);
  }
  vec3 pick7(float i, vec3 a, vec3 b, vec3 c, vec3 d, vec3 e, vec3 f, vec3 g){
    return i<1.?a: i<2.?b: i<3.?c: i<4.?d: i<5.?e: i<6.?f: g;
  }
  // The test card, built from the reference image's proportions (y measured from the top)
  vec3 testCard(float x, float y){
    vec3 W=vec3(1.), Y=vec3(1.,.98,.02), C=vec3(.07,1.,1.), G=vec3(.08,1.,.07), M=vec3(.85,0.,.47), R=vec3(.91,0.,0.), B=vec3(0.,0.,.92), K=vec3(0.);
    float i = floor(x*7.);
    if (y < .725) return pick7(i, W,Y,C,G,M,R,B);
    if (y < .82)  return pick7(i, B,M,Y,R,C,K,W);
    if (y < .91) {
      if (x < .6) return vec3(1. - x/.6);
      return hsv2rgb(vec3((x-.6)/.4*.92, 1., 1.));
    }
    if (x < .45) return vec3(floor(x/.45*11.)/10.);
    if (x < .57) return W;
    return K;
  }
  vec2 vidUV(vec2 s){
    vec2 v = s - .5;
    if (uVidA > uScreenA) v.x *= uScreenA/uVidA; else v.y *= uVidA/uScreenA;
    v /= uZoom;
    v += .5;
    if (uMirror > .5) v.x = 1. - v.x;
    v.y = 1. - v.y;
    return v;
  }
  void main(){
    // gentle CRT bulge
    vec2 c = uv - .5;
    vec2 s = .5 + c*(1. + .22*dot(c,c));
    // tracking wobble and the odd tearing band
    s.x += sin(s.y*38. + uTime*2.7)*.0025;
    float band = step(.985, fract(sin(floor(s.y*24. + uTime*1.3)*91.7)*4375.85));
    s.x += band*(fract(uTime*7.)-.5)*.04;
    // chunky pixels
    vec2 blocks = vec2(128., 96.);
    s = (floor(s*blocks) + .5)/blocks;
    if (s.x < 0. || s.x > 1. || s.y < 0. || s.y > 1.) { gl_FragColor = vec4(0.,0.,0.,1.); return; }
    vec2 top = vec2(s.x, 1. - s.y);

    float mot = texture2D(uMotion, vec2(s.x, 1.-s.y)).r;

    // scroll right -> left
    float x = fract(top.x + uScroll);
    vec3 col = testCard(x, top.y);
    // motion repaints the bars locally, global movement turns the whole palette
    col = hueRot(col, uHue + mot*3.4);
    col = mix(col, col*1.25 + vec3(.08)*mot, mot);
    col *= 1. + uPulse*.35;

    // you, on the set
    if (uHasVid > .5) {
      // the person gets a gentler version of the screen damage
      vec2 sv = .5 + c*(1. + .1*dot(c,c));
      sv.x += sin(sv.y*38. + uTime*2.7)*.001 + band*(fract(uTime*7.)-.5)*.012;
      vec2 vb = vec2(256., 192.);
      sv = (floor(sv*vb) + .5)/vb;
      vec2 v = vidUV(sv);
      float inside = step(0.,v.x)*step(v.x,1.)*step(0.,v.y)*step(v.y,1.);
      vec3 vid = texture2D(uVid, v).rgb;
      float a;
      if (uMaskMode > .5) {
        a = smoothstep(.35, .75, texture2D(uMask, v).r);
      } else {
        vec2 o = (sv - vec2(.5,.47)) / vec2(.30, .42) * vec2(1., 1.);
        a = 1. - smoothstep(.75, 1., length(o));
      }
      a *= inside;
      // broadcast-style chroma bleed on the person
      float off = .002 + mot*.003;
      vec3 split = vec3(texture2D(uVid, v+vec2(off,0.)).r, vid.g, texture2D(uVid, v-vec2(off,0.)).b);
      col = mix(col, split*1.05, a);
    }

    if (uCrt > .5) {
      float line = .8 + .2*sin(uv.y*96.*6.28318);
      col *= line;
      col += (fract(sin(dot(gl_FragCoord.xy + uTime*60., vec2(12.9898,78.233)))*43758.5453) - .5)*.05;
    }
    float vig = smoothstep(.85, .25, length(c*vec2(1.,1.2)));
    col *= mix(.55, 1., vig);
    gl_FragColor = vec4(col, 1.);
  }`;
  const sh = (t, src) => { const s = gl.createShader(t); gl.shaderSource(s, src); gl.compileShader(s); if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw gl.getShaderInfoLog(s); return s; };
  const prog = gl.createProgram();
  gl.attachShader(prog, sh(gl.VERTEX_SHADER, vs)); gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(prog); gl.useProgram(prog);
  const buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(prog, 'p'); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
  const U = {}; ['uTime','uScroll','uHue','uPulse','uHasVid','uMaskMode','uMirror','uCrt','uZoom','uScreenA','uVidA','uRes','uVid','uMask','uMotion'].forEach(n => U[n] = gl.getUniformLocation(prog, n));

  const mkTex = unit => { const t = gl.createTexture(); gl.activeTexture(gl.TEXTURE0 + unit); gl.bindTexture(gl.TEXTURE_2D, t);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.LUMINANCE, 1, 1, 0, gl.LUMINANCE, gl.UNSIGNED_BYTE, new Uint8Array([0])); return t; };
  const texVid = mkTex(0), texMask = mkTex(1), texMot = mkTex(2);
  gl.uniform1i(U.uVid, 0); gl.uniform1i(U.uMask, 1); gl.uniform1i(U.uMotion, 2);
  gl.pixelStorei(gl.UNPACK_ALIGNMENT, 1);

  // ---------- motion map (screen-space, 96x72) ----------
  const MW = 96, MH = 72;
  const trail = new Float32Array(MW*MH), prev = new Float32Array(MW*MH), motBytes = new Uint8Array(MW*MH);
  let havePrev = false;
  const small = document.createElement('canvas'); small.width = MW; small.height = MH;
  const sctx = small.getContext('2d', { willReadFrequently: true });

  // pointer painting works with or without a camera
  let pointerEnergy = 0;
  const splat = (cx, cy, r, amt) => {
    const x0 = Math.max(0, Math.floor(cx - r)), x1 = Math.min(MW-1, Math.ceil(cx + r));
    const y0 = Math.max(0, Math.floor(cy - r)), y1 = Math.min(MH-1, Math.ceil(cy + r));
    for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
      const d = Math.hypot(x - cx, y - cy) / r; if (d < 1) { const i = y*MW + x; trail[i] = Math.min(1, trail[i] + amt*(1 - d*d)); }
    }
  };
  let lastPt = null;
  canvas.addEventListener('pointermove', e => {
    if (!tuned) return;
    const r = canvas.getBoundingClientRect();
    const px = (e.clientX - r.left)/r.width*MW, py = (e.clientY - r.top)/r.height*MH;
    if (lastPt) { const d = Math.hypot(px-lastPt[0], py-lastPt[1]); const n = Math.ceil(d/2)||1;
      for (let k = 1; k <= n; k++) splat(lastPt[0]+(px-lastPt[0])*k/n, lastPt[1]+(py-lastPt[1])*k/n, 6, 0.35);
      pointerEnergy = Math.min(1, pointerEnergy + d*0.01); motionX = px / MW; }
    lastPt = [px, py];
  });
  canvas.addEventListener('pointerleave', () => lastPt = null);

  // ---------- inputs ----------
  const video = document.createElement('video'); video.playsInline = true; video.muted = true; video.loop = true;
  let hasVid = false, vidA = 16/9, source = 'none';

  let tuned = false, camLive = false;
  const setOsd = (txt, live) => {
    if (live) camLive = true;
    if (!tuned) return;
    osdText.textContent = txt; osd.dataset.state = live ? 'live' : 'idle';
  };
  const startVideo = async (kind) => {
    await video.play(); hasVid = true; source = kind; havePrev = false;
    vidA = (video.videoWidth || 16) / (video.videoHeight || 9);
    setOsd('LIVE', true);
    loadSegmenter();
  };

  const startCam = async () => {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ video: { width: { ideal: 1280 }, height: { ideal: 720 }, facingMode: 'user' }, audio: false });
      video.srcObject = stream; video.loop = false;
      await startVideo('cam');
    } catch (err) {
      statusEl.textContent = 'Camera blocked. Open the downloaded file in Chrome.';
    }
  };

  // music: bass pushes the strips
  let analyser = null, freq = null, bass = 0, audio = null, ac = null, mediaSrc = null, fx = null;
  let fuzzGain = null, beepBus = null;
  const getAC = () => {
    if (ac) return ac;
    ac = new (window.AudioContext || window.webkitAudioContext)();
    // static: looped white noise, band-passed so it hisses like an untuned set
    const len = ac.sampleRate * 2, nb = ac.createBuffer(1, len, ac.sampleRate), ch = nb.getChannelData(0);
    for (let i = 0; i < len; i++) ch[i] = (Math.random()*2 - 1) * (Math.random() < 0.002 ? 2.5 : 1);
    const noise = ac.createBufferSource(); noise.buffer = nb; noise.loop = true;
    const hp = ac.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 900;
    const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 7000;
    fuzzGain = ac.createGain(); fuzzGain.gain.value = 0;
    noise.connect(hp); hp.connect(lp); lp.connect(fuzzGain); fuzzGain.connect(ac.destination);
    noise.start();
    beepBus = ac.createGain(); beepBus.gain.value = 0.16; beepBus.connect(ac.destination);
    return ac;
  };
  const setFuzz = on => { if (!fuzzGain) return; fuzzGain.gain.setTargetAtTime(on ? 0.038 : 0, ac.currentTime, 0.15); };
  // browsers only allow sound after a first click or key press
  const wakeAudio = () => {
    getAC(); ac.resume(); setFuzz(!audio);
    if (!tuned) { tuned = true; osd.disabled = true; setOsd('NO SIGNAL', false); startCam(); }
  };
  osd.addEventListener('click', wakeAudio);

  // test-tone beeps, pitch follows where you move (left = low, right = high)
  const SCALE = [440, 523.25, 587.33, 659.25, 783.99, 880, 1000, 1046.5, 1174.66, 1318.5, 1567.98, 1760];
  let lastBeep = 0;
  const beep = (pos, strength) => {
    if (!ac || ac.state !== 'running') return;
    const idx = Math.max(0, Math.min(SCALE.length - 1, Math.round(pos * (SCALE.length - 1) + (Math.random() - 0.5) * 2)));
    const o = ac.createOscillator(), g = ac.createGain(), t0 = ac.currentTime;
    o.type = 'sine'; o.frequency.value = SCALE[idx];
    const dur = 0.09 + Math.random()*0.12;
    g.gain.setValueAtTime(0, t0);
    g.gain.linearRampToValueAtTime(0.5 + strength*0.5, t0 + 0.005);
    g.gain.setValueAtTime(0.5 + strength*0.5, t0 + dur);
    g.gain.linearRampToValueAtTime(0, t0 + dur + 0.01);
    o.connect(g); g.connect(beepBus); o.start(t0); o.stop(t0 + dur + 0.02);
  };
  const removeTrack = () => {
    if (audio) { audio.pause(); URL.revokeObjectURL(audio.src); audio.removeAttribute('src'); audio.load(); }
    try { mediaSrc && mediaSrc.disconnect(); analyser && analyser.disconnect(); fx && fx.out.disconnect(); } catch {}
    fx = null;
    audio = null; mediaSrc = null; analyser = null; freq = null; bass = 0;
    setFuzz(true);
    $('trackBox').hidden = true; $('meter').style.width = '0%';
    $('audFile').value = '';
    $('audLabel').firstChild.textContent = 'bored? sync some music';
  };
  $('audRemove').addEventListener('click', removeTrack);
  $('audFile').addEventListener('change', async e => {
    const f = e.target.files[0]; if (!f) return;
    removeTrack();
    getAC();
    audio = new Audio(URL.createObjectURL(f)); audio.loop = true;
    mediaSrc = ac.createMediaElementSource(audio);
    analyser = ac.createAnalyser(); analyser.fftSize = 1024; analyser.smoothingTimeConstant = 0.75;
    freq = new Uint8Array(analyser.frequencyBinCount);
    // movement-controlled chain: bass shelf -> DJ low-pass -> punch -> stereo -> limiter
    const shelf = ac.createBiquadFilter(); shelf.type = 'lowshelf'; shelf.frequency.value = 120; shelf.gain.value = 0;
    const sub = ac.createBiquadFilter(); sub.type = 'peaking'; sub.frequency.value = 55; sub.Q.value = 1.1; sub.gain.value = 0;
    const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 18000; lp.Q.value = 2.4;
    const hp = ac.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 20; hp.Q.value = 2.4;
    // echo throws: a dotted-eighth-ish delay that only gets fed when you move big
    const echoSend = ac.createGain(); echoSend.gain.value = 0;
    const delay = ac.createDelay(2); delay.delayTime.value = 0.375;
    const fb = ac.createGain(); fb.gain.value = 0.55;
    const echoTone = ac.createBiquadFilter(); echoTone.type = 'bandpass'; echoTone.frequency.value = 1400; echoTone.Q.value = 0.6;
    const pan = ac.createStereoPanner ? ac.createStereoPanner() : ac.createGain();
    const out = ac.createDynamicsCompressor(); out.threshold.value = -10; out.knee.value = 6; out.ratio.value = 6; out.attack.value = 0.004; out.release.value = 0.2;
    mediaSrc.connect(shelf); shelf.connect(sub); sub.connect(lp); lp.connect(hp); hp.connect(pan); pan.connect(out); out.connect(ac.destination);
    hp.connect(echoSend); echoSend.connect(delay); delay.connect(echoTone); echoTone.connect(fb); fb.connect(delay); echoTone.connect(pan);
    hp.connect(analyser);
    fx = { shelf, sub, lp, hp, echoSend, pan, out };
    try {
      await ac.resume(); await audio.play();
      $('trackName').textContent = f.name;
      $('trackBox').hidden = false;
      setFuzz(false);
      $('audLabel').firstChild.textContent = 'swap track';
    } catch { removeTrack(); }
  });

  // drawer
  const drawer = $('drawer'), toggle = $('toggle');
  toggle.addEventListener('click', () => {
    const open = !drawer.classList.contains('open');
    drawer.classList.toggle('open', open);
    document.body.classList.toggle('ctl-open', open);
    toggle.setAttribute('aria-expanded', String(open));
    toggle.textContent = open ? 'close' : 'controls';
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && drawer.classList.contains('open')) toggle.click(); });

  // ---------- optional body cutout (MediaPipe; needs network access to its model files) ----------
  let seg = null, segReady = false, segBusy = false, segTried = false, maskFrame = null;
  function loadSegmenter() {
    if (segTried) return; segTried = true;
    const base = 'https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation@0.1.1675465747/';
    const s = document.createElement('script'); s.src = base + 'selfie_segmentation.js'; s.crossOrigin = 'anonymous';
    s.onload = async () => {
      try {
        seg = new window.SelfieSegmentation({ locateFile: f => base + f });
        seg.setOptions({ modelSelection: 1 });
        seg.onResults(r => { maskFrame = r.segmentationMask; segBusy = false; });
        await Promise.race([seg.initialize(), new Promise((_, rej) => setTimeout(() => rej('timeout'), 12000))]);
        segReady = true;
      } catch { segReady = false; }
    };
    s.onerror = () => { segReady = false; };
    document.head.appendChild(s);
  }

  // ---------- loop ----------
  let clock = 0, scroll = 0, hue = 0, energy = 0, motionX = 0.5, last = performance.now();
  const resize = () => {
    const r = canvas.getBoundingClientRect(), dpr = Math.min(2, window.devicePixelRatio || 1);
    const w = Math.max(2, Math.round(r.width*dpr)), h = Math.max(2, Math.round(r.height*dpr));
    if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; gl.viewport(0, 0, w, h); }
  };
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function frame(now) {
    const dt = tuned ? Math.min(0.05, (now - last)/1000) : 0; last = now;
    resize();
    const decay = S.trail;
    for (let i = 0; i < trail.length; i++) trail[i] *= decay;

    // camera / video motion
    let camEnergy = 0;
    if (hasVid && video.readyState >= 2) {
      vidA = video.videoWidth / video.videoHeight || vidA;
      // draw the frame as it appears on screen (cover-fit, zoom, mirror) so motion lines up with you
      const sA = canvas.width / canvas.height;
      let sw = video.videoWidth, sh2 = video.videoHeight;
      if (vidA > sA) sw = sh2*sA; else sh2 = sw/sA;
      sw /= S.zoom; sh2 /= S.zoom;
      const sx = (video.videoWidth - sw)/2, sy = (video.videoHeight - sh2)/2;
      sctx.save();
      if (S.mirror) { sctx.translate(MW, 0); sctx.scale(-1, 1); }
      sctx.drawImage(video, sx, sy, sw, sh2, 0, 0, MW, MH);
      sctx.restore();
      const px = sctx.getImageData(0, 0, MW, MH).data;
      let sum = 0, sumX = 0;
      for (let i = 0, j = 0; i < trail.length; i++, j += 4) {
        const l = (px[j]*0.299 + px[j+1]*0.587 + px[j+2]*0.114)/255;
        if (havePrev) {
          let d = Math.abs(l - prev[i]) * 6 * S.sens - 0.12;
          if (d > 0) { d = Math.min(1, d); sum += d; sumX += d * (i % MW); if (d > trail[i]) trail[i] = d; }
        }
        prev[i] = l;
      }
      havePrev = true;
      camEnergy = Math.min(1, sum / (MW*MH) * 8);
      if (sum > 0) motionX = sumX / sum / MW;

      gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, texVid);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGB, gl.RGB, gl.UNSIGNED_BYTE, video);

      if (segReady && !segBusy) { segBusy = true; seg.send({ image: video }).catch(() => { segBusy = false; }); }
      if (maskFrame) { gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, texMask);
        try { gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, maskFrame); } catch {} }
    }

    for (let i = 0; i < trail.length; i++) motBytes[i] = trail[i]*255;
    gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_2D, texMot);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.LUMINANCE, MW, MH, 0, gl.LUMINANCE, gl.UNSIGNED_BYTE, motBytes);

    // music
    if (analyser) {
      analyser.getByteFrequencyData(freq);
      let b = 0; for (let i = 1; i < 10; i++) b += freq[i]; b = b/9/255;
      bass += (Math.max(0, b - 0.45)*2 - bass) * 0.35;
    }

    pointerEnergy *= 0.92;
    const target = Math.max(camEnergy, pointerEnergy);
    // DJ mode: move on the left = low-pass sweep, on the right = high-pass sweep,
    // the more you move the deeper the sweep, the fatter the bass and the more echo gets thrown
    if (fx && ac) {
      const m = Math.min(1, energy * 3), tc = ac.currentTime;
      const knob = Math.max(-1, Math.min(1, (motionX - 0.5) * 3.2)) * m;
      fx.lp.frequency.setTargetAtTime(knob < 0 ? 18000 * Math.pow(140/18000, -knob) : 18000, tc, 0.09);
      fx.hp.frequency.setTargetAtTime(knob > 0 ? 20 * Math.pow(4000/20, knob) : 20, tc, 0.09);
      fx.shelf.gain.setTargetAtTime(knob > 0.3 ? 0 : m * 15, tc, 0.08);
      fx.sub.gain.setTargetAtTime(knob > 0.3 ? 0 : m * 9, tc, 0.08);
      fx.echoSend.gain.setTargetAtTime(m > 0.3 ? (m - 0.3) * 1.8 : 0, tc, 0.06);
      if (fx.pan.pan) fx.pan.pan.setTargetAtTime((motionX - 0.5) * 1.4 * m, tc, 0.12);
    }
    // too much movement: beeps, faster the wilder you get
    if (!audio && target > 0.32 && now - lastBeep > 260 - Math.min(160, (target - 0.32) * 300)) { lastBeep = now; beep(motionX, target); }
    energy += (target - energy) * 0.12;
    if (analyser && freq) { let lv = 0; for (let i = 1; i < 64; i++) lv += freq[i]; $('meter').style.width = Math.min(100, Math.round(lv/63/255*140)) + '%'; }

    const motionScale = reduced ? 0.3 : 1;
    scroll += dt * (0.06*S.speed + energy*0.35 + bass*0.5) * motionScale;
    hue += dt * energy * 2.2;

    clock += dt; gl.uniform1f(U.uTime, clock);
    gl.uniform1f(U.uScroll, scroll % 1);
    gl.uniform1f(U.uHue, hue % 6.2832);
    gl.uniform1f(U.uPulse, bass);
    gl.uniform1f(U.uHasVid, hasVid ? 1 : 0);
    gl.uniform1f(U.uMaskMode, (segReady && maskFrame) ? 1 : 0);
    gl.uniform1f(U.uMirror, S.mirror ? 1 : 0);
    gl.uniform1f(U.uCrt, S.crt ? 1 : 0);
    gl.uniform1f(U.uZoom, S.zoom);
    gl.uniform1f(U.uScreenA, canvas.width / canvas.height);
    gl.uniform1f(U.uVidA, vidA);
    gl.uniform2f(U.uRes, canvas.width, canvas.height);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
